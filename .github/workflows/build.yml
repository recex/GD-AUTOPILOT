name: Build GD AUTOPILOT

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    name: Core C++23 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and execute core engine tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -DGD_AUTOPILOT_STANDALONE -Isrc \
            src/core/DebugLog.cpp \
            src/modules/PhysicsEngine.cpp \
            src/modules/LevelAnalyzer.cpp \
            src/modules/GameController.cpp \
            src/modules/LearningSystem.cpp \
            src/modules/AIEngine.cpp \
            src/modules/StatisticsManager.cpp \
            tests/test_autopilot.cpp \
            -o build_test_autopilot
          ./build_test_autopilot

  build:
    name: Build (${{ matrix.config.name }})
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine & Package .geode
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine multi-platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd-autopilot-geode
          path: ${{ steps.combine.outputs.build-output }}

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTPUT: ${{ steps.combine.outputs.build-output }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$BUILD_OUTPUT"/*.geode \
            --title "GD AUTOPILOT $GITHUB_REF_NAME" \
            --generate-notes
